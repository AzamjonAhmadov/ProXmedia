<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="/mobilography-web/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="ProxMedia — a modern platform for media industry professionals.">
  <meta name="theme-color" content="#6366F1">
  <meta name="color-scheme" content="dark light">

  <!-- Open Graph / social cards -->
  <meta property="og:title" content="ProxMedia">
  <meta property="og:description" content="Zamonaviy media platforma — fotograf, videograf va kontent mualliflari uchun.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ProxMedia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>ProxMedia</title>

  <style>
    :root {
      --brand-1: #6366F1;
      --brand-2: #8B5CF6;
      --brand-3: #EC4899;
      --bg-dark: #05070D;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #F8FAFC;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #F7F8FC; color: #0F172A; }
    }

    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 9999;
      background:
        radial-gradient(60% 50% at 50% 30%, rgba(99,102,241,0.18), transparent 70%),
        radial-gradient(50% 40% at 50% 80%, rgba(236,72,153,0.14), transparent 70%),
        var(--bg-dark);
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }
    @media (prefers-color-scheme: light) {
      #boot {
        background:
          radial-gradient(60% 50% at 50% 30%, rgba(99,102,241,0.14), transparent 70%),
          radial-gradient(50% 40% at 50% 80%, rgba(236,72,153,0.10), transparent 70%),
          #F7F8FC;
      }
    }
    #boot.hide { opacity: 0; visibility: hidden; }

    .boot-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08) inset,
        0 24px 60px -10px rgba(99,102,241,0.55),
        0 12px 40px rgba(236,72,153,0.25);
      display: grid;
      place-items: center;
      animation: pulse 2.4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .logo::before {
      content: "";
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      height: 28px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    }
    .logo svg { width: 44px; height: 44px; color: white; position: relative; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--brand-1), #22D3EE, var(--brand-3), var(--brand-1));
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 2.4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .tag {
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(148, 163, 184, 0.9);
      text-transform: uppercase;
    }

    .bar {
      width: 180px;
      height: 4px;
      border-radius: 4px;
      background: rgba(148,163,184,0.18);
      overflow: hidden;
      position: relative;
    }
    .bar::after {
      content: "";
      position: absolute;
      top: 0; left: -40%;
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--brand-1), #22D3EE, transparent);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="boot-stack">
      <div class="logo" role="img" aria-label="ProxMedia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <div class="brand">PROXMEDIA</div>
      <div class="tag">MEDIA INDUSTRY PROFESSIONALS HERE</div>
      <div class="bar" role="progressbar"></div>
    </div>
  </div>

  <script>
    // Hide boot overlay once Flutter renders the first frame.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) {
        b.classList.add('hide');
        setTimeout(function () { b.remove(); }, 700);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
